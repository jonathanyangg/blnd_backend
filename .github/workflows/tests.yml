name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Start local Supabase (applies migrations)
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      # seed.sql demo users/movies collide with test fixtures; test on an empty DB.
      - run: supabase db reset --local --no-seed

      - name: Run tests
        env:
          # conftest defaults to this and refuses any non-local host.
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # OpenAI 3 validates credentials when the client is constructed.
          OPENAI_API_KEY: test-key
        run: uv run --locked pytest -q
